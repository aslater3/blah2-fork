# Reference channel is index 0, surveillance channel is index 1. Keep arrays ordered accordingly.
capture:
  fs: 2000000
  fc: 576000000
  device:
    type: "dual-rtl"
    gain: [7.0, 25.0]        # gain[0] applies to reference channel (lower - strong direct path); gain[1] to surveillance channel (higher - weak reflections)
    serial: ["REF", "SURV"]  # serial[0] -> reference, serial[1] -> surveillance
    sync:
      enable: true
      seconds: 0.25
      search: 131072
      min_snr_db: 10.0
      calibration_fc: 0
      recalibrate_interval: 10   # re-run sync calibration every N CPI cycles (0 = startup only)
  replay:
    state: false
    loop: true
    file: '/opt/blah2/replay/file.dualrtl'

process:
  data:
    cpi: 0.5
    buffer: 8.0
    overlap: 0
  ambiguity:
    delayMin: -10
    delayMax: 1200
    dopplerMin: -500
    dopplerMax: 500
  clutter:
    enable: true
    delayMin: -10
    delayMax: 200       # clutter filter only needs to cover direct path + close multipath (not full range)
  detection:
    enable: true
    pfa: 0.00001
    nGuard: 2
    nTrain: 6
    minDelay: 5
    minDoppler: 15
    nCentroid: 6
  tracker:
    enable: true
    initiate:
      M: 3
      N: 5
      maxAcc: 10
    delete: 10
    smooth: "none"

network:
  ip: 0.0.0.0
  ports:
    api: 3000
    map: 3001
    detection: 3002
    track: 3003
    timestamp: 4000
    timing: 4001
    iqdata: 4002
    config: 4003
  stream:
    map: false
    detection: true
    track: true
    timestamp: true
    timing: false
    iqdata: false

truth:
  adsb:
    enabled: false
    tar1090: 'adsb.30hours.dev'
    adsb2dd: 'adsb2dd.30hours.dev'
  ais:
    enabled: false
    ip: 0.0.0.0
    port: 30001

location:
  rx:
    latitude: 53.76355598527745
    longitude: -2.7685548091440078
    altitude: 50
    name: "Preston"
  tx:
    latitude: 53.6122
    longitude: -2.5274
    altitude: 456
    name: "Winter Hill"

save:
  iq: true
  map: true
  detection: true
  timing: true
  path: "/blah2/save/"
