<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>blah2 - Calibration Data</title>
  <!-- load lib js -->
  <script src="../../lib/bootstrap-5.2.3.min.js"></script>
  <script src="../../lib/jquery-3.6.4.min.js"></script>
  <!-- load lib css -->
  <link rel="stylesheet" href="../../lib/bootstrap-5.2.3.min.css">
  <link rel="stylesheet" href="../../lib/blah2.css">
  <style>
    .data-section {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
      overflow-x: auto;
    }
    pre {
      color: var(--text-primary);
      margin: 0;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 1.2rem;
      color: var(--accent-color);
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="main-content">
      <div class="container-fluid">
        <h1 class="mb-4">Calibration & Sync Data</h1>
        
        <div class="row">
          <div class="col-md-6">
            <div class="data-section">
              <h2>Calibration Data</h2>
              <div id="calibration-data">Loading...</div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="data-section">
              <h2>Sync / Timing Data</h2>
              <div id="timing-data">Loading...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    $(document).ready(function() {
      // Fetch Calibration Data
      $.getJSON('/api/calibration', function(data) {
        $('#calibration-data').html('<pre>' + JSON.stringify(data, null, 2) + '</pre>');
      }).fail(function() {
        $('#calibration-data').html('<div class="text-danger">Failed to load calibration data</div>');
      });

      // Fetch Timing Data
      $.getJSON('/api/timing', function(data) {
        $('#timing-data').html('<pre>' + JSON.stringify(data, null, 2) + '</pre>');
      }).fail(function() {
        $('#timing-data').html('<div class="text-danger">Failed to load timing data</div>');
      });
    });
  </script>
  <script src="../../js/common.js"></script>
  <script src="../../control.js"></script>
  <script src="../../js/navigation.js"></script>
</body>
</html>
